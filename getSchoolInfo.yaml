openapi: 3.0.3
info:
  title: NEIS School Info API
  description: "학교기본정보 (School basic information) - generated from 학교기본정보_오픈API명세서.xls"
  version: "1.0.0"
servers:
  - url: https://open.neis.go.kr
paths:
  /hub/schoolInfo:
    get:
      summary: Retrieve school basic information
      description: "Returns school information. Supports pagination and filters."
      parameters:
        - name: Key
          in: query
          required: true
          schema:
            type: string
          description: "인증키 (example: sample key)"
        - name: Type
          in: query
          required: true
          schema:
            type: string
            enum: [xml, json]
          description: "호출 문서 포맷 (기본값: xml)"
        - name: pIndex
          in: query
          required: true
          schema:
            type: integer
            default: 1
          description: "페이지 위치 (기본값: 1)"
        - name: pSize
          in: query
          required: true
          schema:
            type: integer
            default: 100
          description: "페이지 당 요청 숫자 (기본값: 100)"
        - name: ATPT_OFCDC_SC_CODE
          in: query
          required: false
          schema:
            type: string
          description: "시도교육청코드"
        - name: SD_SCHUL_CODE
          in: query
          required: false
          schema:
            type: string
          description: "행정표준코드"
        - name: SCHUL_NM
          in: query
          required: false
          schema:
            type: string
          description: "학교명"
        - name: SCHUL_KND_SC_NM
          in: query
          required: false
          schema:
            type: string
          description: "학교종류명"
        - name: LCTN_SC_NM
          in: query
          required: false
          schema:
            type: string
          description: "시도명"
        - name: FOND_SC_NM
          in: query
          required: false
          schema:
            type: string
          description: "설립명"
      responses:
        "200":
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: string
                    description: "처리 코드"
                  resultMsg:
                    type: string
                    description: "처리 메시지"
                  schoolInfo:
                    type: array
                    items:
                      type: object
                      properties:
                        ATPT_OFCDC_SC_CODE:
                          type: string
                          description: "시도교육청코드"
                        ATPT_OFCDC_SC_NM:
                          type: string
                          description: "시도교육청명"
                        SD_SCHUL_CODE:
                          type: string
                          description: "행정표준코드"
                        SCHUL_NM:
                          type: string
                          description: "학교명"
                        ENG_SCHUL_NM:
                          type: string
                          description: "영문학교명"
                        SCHUL_KND_SC_NM:
                          type: string
                          description: "학교종류명"
                        LCTN_SC_NM:
                          type: string
                          description: "시도명"
                        JU_ORG_NM:
                          type: string
                          description: "관할조직명"
                        FOND_SC_NM:
                          type: string
                          description: "설립명"
                        ORG_RDNZC:
                          type: string
                          description: "도로명우편번호"
                        ORG_RDNMA:
                          type: string
                          description: "도로명주소"
                        ORG_RDNDA:
                          type: string
                          description: "도로명상세주소"
                        ORG_TELNO:
                          type: string
                          description: "전화번호"
                        HMPG_ADRES:
                          type: string
                          description: "홈페이지주소"
                        COEDU_SC_NM:
                          type: string
                          description: "남녀공학구분명"
                        ORG_FAXNO:
                          type: string
                          description: "팩스번호"
                        HS_SC_NM:
                          type: string
                          description: "고등학교구분명"
                        INDST_SPECL_CCCCL_EXST_YN:
                          type: string
                          description: "산업체특별학급존재여부"
                        HS_GNRL_BUSNS_SC_NM:
                          type: string
                          description: "고등학교일반전문구분명"
                        SPCLY_PURPS_HS_ORD_NM:
                          type: string
                          description: "특수목적고등학교계열명"
                        ENE_BFE_SEHF_SC_NM:
                          type: string
                          description: "입시전후기구분명"
                        DGHT_SC_NM:
                          type: string
                          description: "주야구분명"
                        FOND_YMD:
                          type: string
                          format: date
                          description: "설립일자"
                        FOAS_MEMRD:
                          type: string
                          format: date
                          description: "개교기념일"
                        LOAD_DTM:
                          type: string
                          format: date-time
                          description: "수정일자"
        "400":
          description: "Bad request / missing parameter"
        "401":
          description: "Unauthorized"
        "500":
          description: "Server error"
components:
  schemas: {}
